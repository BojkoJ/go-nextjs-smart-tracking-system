apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: tracking-system
  annotations:
    # PreSync = ArgoCD spustí tento Job PŘED aplikováním ostatních manifestů
    argocd.argoproj.io/hook: PreSync
    # HookSucceeded = ArgoCD smaže Job po úspěšném dokončení (neshromažďují se staré Joby)
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  # backoffLimit: 3 = Job se pokusí 3× při selhání (síťový výpadek, postgres restart)
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          # postgres:16-alpine obsahuje psql client, žádný custom image není potřeba
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              psql "$POSTGRES_URL" <<'EOF'
              CREATE TABLE IF NOT EXISTS assets (
                  id              TEXT PRIMARY KEY,
                  name            TEXT NOT NULL,
                  max_temperature DOUBLE PRECISION NOT NULL,
                  min_temperature DOUBLE PRECISION NOT NULL,
                  max_humidity    DOUBLE PRECISION NOT NULL,
                  status          TEXT NOT NULL DEFAULT 'new',
                  created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE TABLE IF NOT EXISTS telemetry (
                  id           BIGSERIAL PRIMARY KEY,
                  asset_id     TEXT NOT NULL REFERENCES assets(id),
                  latitude     DOUBLE PRECISION NOT NULL,
                  longitude    DOUBLE PRECISION NOT NULL,
                  temperature  DOUBLE PRECISION NOT NULL,
                  humidity     DOUBLE PRECISION NOT NULL,
                  is_locked    BOOLEAN NOT NULL,
                  timestamp_ns BIGINT NOT NULL,
                  trace_id     TEXT NOT NULL,
                  recorded_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE TABLE IF NOT EXISTS alerts (
                  id         TEXT PRIMARY KEY,
                  asset_id   TEXT NOT NULL REFERENCES assets(id),
                  type       TEXT NOT NULL,
                  message    TEXT NOT NULL,
                  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );
              CREATE INDEX IF NOT EXISTS idx_telemetry_asset_id ON telemetry(asset_id, timestamp_ns DESC);
              CREATE INDEX IF NOT EXISTS idx_alerts_asset_id ON alerts(asset_id);
              INSERT INTO assets (id, name, max_temperature, min_temperature, max_humidity, status)
              SELECT 'asset-' || i, 'IQM Container  #' || i, 28.0, 12.0, 45.0, 'active'
              FROM generate_series(1, 50) AS i
              ON CONFLICT (id) DO NOTHING;
              EOF
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: tracking-secret
                  key: POSTGRES_URL