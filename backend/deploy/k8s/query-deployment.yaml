apiVersion: apps/v1
kind: Deployment
metadata:
  name: query
  namespace: tracking-system
  labels:
    app: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
    spec:
      containers:
        - name: query
          image: ghcr.io/bojkoj/query:49de079
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: tracking-config
            - secretRef:
                name: tracking-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /assets
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /assets
              port: 8080
            # Delší delay než readiness — pod musí mít čas navázat DB spojení před prvním liveness checkem
            initialDelaySeconds: 15
            periodSeconds: 20
            # 3 selhání × 20s = 60s tolerance před restartem (méně agresivní než readiness)
            failureThreshold: 3