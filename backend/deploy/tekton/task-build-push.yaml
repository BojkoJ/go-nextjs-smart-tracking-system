apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-push
  namespace: tracking-system
spec:
  params:
    - name: service
      type: string
      description: "Název služby: ingest | processor | query | simulator | frontend"
    - name: image-tag
      type: string
      description: "Git short SHA z task-git-clone (7 znaků)"
    - name: registry
      type: string
      description: "Container registry prefix"
      default: ghcr.io/bojkoj
    - name: dockerfile
      type: string
      description: "Relativní cesta k Dockerfile od kořene workspace"
      default: backend/Dockerfile
    - name: context
      type: string
      description: "Relativní cesta ke kontextu buildu od kořene workspace"
      default: backend
    - name: build-args
      type: string
      description: "Volitelný --build-arg pro Kaniko (prázdný = žádný)"
      default: ""
  workspaces:
    - name: source
      description: Naklonovaný repozitář (Kaniko čte Dockerfile + kontext)
    - name: docker-credentials
      description: >
        Secret s Docker config.json (ghcr.io token).
        Mountovaný jako /kaniko/.docker/config.json přes volumeMount.
      mountPath: /kaniko/.docker
  steps:
    - name: build-and-push
      # gcr.io/kaniko-project/executor = official Kaniko image
      # :latest je OK — Kaniko je stabilní, breaking changes jsou vzácné
      image: gcr.io/kaniko-project/executor:latest
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --build-arg=$(params.build-args)
        # Pushujeme dvě tagy: SHA tag (immutable) + latest (mutable pointer)
        - --destination=$(params.registry)/$(params.service):$(params.image-tag)
        - --destination=$(params.registry)/$(params.service):latest
        # cache-repo = Kaniko layer cache v registry (urychluje opakované buildy)
        - --cache=true
        - --cache-repo=$(params.registry)/kaniko-cache