apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-sa
  namespace: tracking-system
# Secrets jsou zde jen odkazem - Tekton je čte a automaticky konfiguruje
# git credentials (.gitconfig) a docker credentials (/tekton/creds/)
# před spuštěním každého Task Podu.
secrets:
  - name: git-credentials    # GitHub PAT pro git clone + git push
  - name: ghcr-credentials   # Docker token pro kaniko push
---
# ClusterRole + Binding pro tekton-sa:
# Tekton potřebuje číst Secrets a PipelineRuns z namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-sa-rolebinding
  namespace: tracking-system
subjects:
  - kind: ServiceAccount
    name: tekton-sa
    namespace: tracking-system
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io